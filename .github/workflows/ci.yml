name: Cartmask checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      # Real-scan parity and audit tests skip themselves: CARTMASK_DATA is not set here.
      - name: Test without external scan downloads
        run: npx vitest run

  python:
    name: Python evidence experiments (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f python/requirements.txt ]; then
            python -m pip install -r python/requirements.txt
          else
            echo "python/requirements.txt not found: nothing to install"
          fi
      - name: Test
        shell: bash
        run: |
          if [ -d python/tests ]; then
            python -m pytest python/tests -q
          else
            echo "python/tests not found: skipping"
          fi
